[tools]
erlang = "28.5"
elixir = "1.20.4-otp-28"
python = "3.13"
tuist = "4.214.0"
swiftlint = "0.65.1"
swiftformat = "0.64.3"
"packslip:damian-kolasinski/crem" = "0.2.0"

# Per-worktree PORT and LATER_DB_NAME come from mise.local.toml, written by .config/wt.toml.

[tasks.setup]
description = "Once after cloning: git hooks, pitcrew, Postgres and server dependencies."
run = '''
git config core.hooksPath .githooks
git submodule update --init
mise run db:up
cd server && mix setup
'''

[tasks."db:up"]
description = "Start the Postgres container shared by every worktree."
run = "docker compose up -d --wait postgres"

[tasks."server:dev"]
description = "Run the Phoenix API on this worktree's PORT and database."
dir = "server"
depends = ["db:up"]
run = '''
mix do ecto.create --quiet + ecto.migrate --quiet
mix phx.server
'''

[tasks."server:test"]
description = "Run server tests against this worktree's test database."
dir = "server"
depends = ["db:up"]
run = "mix test"

[tasks."server:format"]
description = "Format Elixir sources."
dir = "server"
run = "mix format"

[tasks."server:lint"]
description = "Format check, warnings as errors, Credo and Sobelow."
dir = "server"
run = "mix lint"

[tasks."ios:generate"]
description = "Generate the Xcode workspace with Tuist, pointing the app at this worktree's server."
dir = "ios"
run = 'TUIST_LATER_API_BASE_URL="http://localhost:${PORT:-4000}" tuist generate --no-open'

[tasks."server:lan"]
description = "Like server:dev, but reachable from other devices on the local network."
env = { LATER_DEV_LAN = "1" }
run = "mise run server:dev"

[tasks."ios:build"]
description = "Build the app for this worktree's simulator."
run = "scripts/ios.sh build"

[tasks."ios:test"]
description = "Run iOS tests on this worktree's simulator."
run = "scripts/ios.sh test"

[tasks."ios:run"]
description = "Build, install and launch the app on this worktree's simulator."
run = "scripts/ios.sh run"

[tasks."ios:device"]
description = "Build an Ad Hoc app and run it on a connected iPhone (signing from crem.yaml)."
run = "scripts/ios.sh device"

[tasks."ios:lint"]
description = "SwiftLint, SwiftFormat in check mode, and the module graph: imports declared, edges allowed."
dir = "ios"
run = '''
swiftlint lint --strict --quiet
swiftformat --lint .
tuist inspect dependencies
python3 -I ../scripts/ios-module-rules.py
'''

[tasks.lint]
description = "Every linter in the repository."
depends = ["server:lint", "ios:lint"]

[tasks.check]
description = "What the merge queue runs: lint and tests for the parts this branch changed."
run = "scripts/check.sh"

[tasks.review]
description = "Open pitcrew local-review for this worktree (review, approve, merge queue)."
run = "python3 tools/pitcrew/local-review/server.py"
